<!-- Mobile backdrop -->
@if (menuService.showMobileSidebar) {
<div class="fixed inset-0 z-40 backdrop-blur-sm lg:hidden" (click)="toggleMobileSidebar()"></div>
}

<!-- Desktop sidebar -->
<nav
  class="glass app-glass-frame hidden h-full flex-col justify-between pt-3 transition-all duration-300 lg:flex"
  [ngClass]="menuService.showSideBar ? 'w-[210px] xl:w-[280px]' : 'w-[70px]'">
  <div class="overflow-hidden">
    <div
      class="mx-4 mb-2 flex h-9 items-center"
      [ngClass]="menuService.showSideBar ? 'justify-between' : 'justify-center'">
      @if (menuService.showSideBar) {
      <a routerLink="/dashboard/admin" class="flex items-center rounded-md focus:outline-hidden focus-visible:ring-1">
        <app-redom-logo class="h-5" />
      </a>
      } @else {
      <!-- Colapsado: el isotipo también expande el menú -->
      <button type="button" (click)="toggleSidebar()" class="flex items-center rounded-md focus:outline-hidden focus-visible:ring-1" aria-label="Expandir menú">
        <app-redom-logo variant="isotipo" decorative class="h-7" />
      </button>
      }

      @if (menuService.showSideBar) {
      <button
        (click)="toggleSidebar()"
        aria-label="Contraer menú"
        class="text-muted-foreground/50 hover:text-muted-foreground flex items-center justify-center rounded-md p-2 transition-all duration-200 focus:outline-hidden">
        <app-icon>keyboard_double_arrow_left</app-icon>
      </button>
      }
    </div>

    <div
      class="scrollbar-thumb--sm scrollbar-track-rounded scrollbar-thin scrollbar-track-transparent scrollbar-thumb-card h-full overflow-auto px-4">
      <app-sidebar-menu></app-sidebar-menu>
    </div>
  </div>

  <div class="mx-4 my-4 space-y-1">
    <a
      target="_blank"
      href="https://github.com/redom-chile/redom-chile-backoffice-front"
      class="-sm glass-row group flex h-9 cursor-pointer items-center justify-start rounded-md p-2">
      <app-icon class="text-muted-foreground/50 h-5 w-5">info</app-icon>

      <div class="ml-3 truncate text-[10px] font-semibold tracking-wide focus:outline-hidden">
        <span class="bg-primary/10 text-primary px-2 font-semibold"> v{{ appJson.version }} </span>
      </div>

      @if (!menuService.showSideBar) {
      <div class="fixed w-full">
        <span
          class="z-1 bg-foreground text-background absolute left-12 -top-4 w-auto min-w-max origin-left scale-0 p-2 text-xs font-bold shadow-md transition-all duration-200 group-hover:scale-100">
          v{{ appJson.version }}
        </span>
      </div>
      }
    </a>
  </div>
</nav>

<!-- Mobile sidebar overlay -->
@if (menuService.showMobileSidebar) {
<nav
  class="glass fixed inset-y-0 left-0 z-50 flex w-[280px] flex-col justify-between pt-3 shadow-2xl transition-all duration-300 lg:hidden">
  <div class="overflow-hidden">
    <div class="mx-4 mb-2 flex h-9 items-center justify-between">
      <div class="flex items-center">
        <a routerLink="/dashboard/admin" (click)="toggleMobileSidebar()" class="flex items-center rounded-md focus:outline-hidden focus-visible:ring-1">
          <app-redom-logo class="h-5" />
        </a>
      </div>
      <button
        (click)="toggleMobileSidebar()"
        class="text-muted-foreground/50 hover:text-muted-foreground flex items-center justify-center rounded-md p-2 transition-all duration-200 focus:outline-hidden">
        <app-icon>close</app-icon>
      </button>
    </div>

    <div
      class="scrollbar-thumb-rounded scrollbar-track-rounded scrollbar-thin scrollbar-track-transparent scrollbar-thumb-card h-full overflow-auto px-4">
      <app-sidebar-menu></app-sidebar-menu>
    </div>
  </div>

  <div class="mx-4 my-4 space-y-1">
    <a
      target="_blank"
      href="https://github.com/redom-chile/redom-chile-backoffice-front"
      class="-sm glass-row group flex h-9 cursor-pointer items-center justify-start rounded-md p-2">
      <app-icon class="text-muted-foreground/50 h-5 w-5">info</app-icon>
      <div class="ml-3 truncate text-[10px] font-semibold tracking-wide focus:outline-hidden">
        <span class="bg-primary/10 text-primary px-2 font-semibold"> v{{ appJson.version }} </span>
      </div>
    </a>
  </div>
</nav>
}
