@let sectors = $sectors(); @let isLoading = $isLoading(); @let hasError = $hasError();

<div>
  <app-header-dashboard title="Sectores" subtitle="Gestiona los sectores o salones de tu restaurante">
    <app-button
      full
      impact="bold"
      tone="primary"
      shape="rounded"
      size="medium"
      icon="add"
      (buttonClick)="createSector()">
      Crear sector
    </app-button>
    <app-button full impact="light" tone="primary" shape="rounded" size="medium" icon="refresh" (buttonClick)="retry()">
      Actualizar
    </app-button>
  </app-header-dashboard>

  @if (hasError) {
  <div class="flex flex-col items-center gap-4 py-16 text-center">
    <app-icon class="text-destructive h-14 w-14">error_outline</app-icon>
    <div>
      <h2 class="text-foreground text-lg font-semibold">Error al cargar los sectores</h2>
      <p class="text-muted-foreground mt-1 text-sm">No se pudieron obtener los datos. Intenta nuevamente.</p>
    </div>
    <app-button impact="bold" tone="primary" shape="rounded" (buttonClick)="retry()">Reintentar</app-button>
  </div>
  } @else {
  <app-sectors-table
    [sectors]="sectors ?? []"
    [isLoading]="isLoading ?? false"
    (pageChange)="onPageChange($event)"
    (perPageChange)="onPerPageChange($event)"
    (searchNameChange)="onSearchNameChange($event)"
    (retryData)="retry()" />
  }
</div>
