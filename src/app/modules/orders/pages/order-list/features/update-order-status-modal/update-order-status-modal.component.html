@let isLoading = $isLoading();
<app-modal-card>
  <ng-template app-slot="header"><h1 class="text-primary dark:text-foreground">Cambiar estado — Pedido #{{ data.id }}</h1></ng-template>
  <button mat-icon-button class="close-button" (click)="dialogRef.close()"><app-icon class="text-primary">close</app-icon></button>
  <div class="p-2">
    <p class="text-muted-foreground mb-4 text-sm">Estado actual: <strong>{{ data.status }}</strong></p>
    <div class="grid grid-cols-2 gap-2">
      @for (t of transitions; track t.status) {
      <button
        class="glass-row flex items-center gap-2 rounded-lg p-3 text-left transition-all hover:scale-[1.02]"
        [class.ring-2]="data.status === t.status"
        [class.ring-primary]="data.status === t.status"
        [disabled]="isLoading"
        (click)="select(t.status)">
        <app-icon class="h-5 w-5">{{ t.icon }}</app-icon>
        <span class="text-foreground text-sm font-medium">{{ t.label }}</span>
      </button>
      }
    </div>
  </div>
  <ng-template app-slot="footer">
    <app-button full impact="light" (buttonClick)="dialogRef.close()">Cancelar</app-button>
  </ng-template>
</app-modal-card>
