<div #screen class="auth-screen min-h-dvh relative overflow-x-hidden">
  <!-- Fondo fijo a pantalla completa: color primario + líneas (con leve movimiento y parallax) + profundidad -->
  <div class="bg-primary fixed inset-0" aria-hidden="true"></div>
  <div class="auth-lines-drift fixed" aria-hidden="true">
    <div class="auth-bg auth-lines-parallax absolute inset-0 bg-cover"></div>
  </div>
  <div class="auth-shade fixed inset-0" aria-hidden="true"></div>
  <div class="auth-blobs-parallax fixed inset-0" aria-hidden="true">
    <span class="auth-blob auth-blob--a"></span>
    <span class="auth-blob auth-blob--b"></span>
  </div>

  <div class="auth-safe min-h-dvh relative grid grid-rows-[auto_1fr] lg:grid-cols-2 lg:grid-rows-1">
    <!-- Marca: centrada sobre la tarjeta en móvil/tablet, a la izquierda en escritorio -->
    <section
      class="flex flex-col items-center justify-center px-6 pt-8 text-center text-white sm:pt-12 lg:items-start lg:px-16 lg:pt-0 lg:text-left">
      <h1 class="sr-only">REDOM: Todo tu restaurante, en una vuelta.</h1>
      <app-redom-logo glass class="[--redom-logo-size:2.25rem] sm:[--redom-logo-size:2.75rem] lg:[--redom-logo-size:3.5rem]">
        <p class="redom-promise" aria-hidden="true">Todo tu restaurante, en una vuelta.</p>
      </app-redom-logo>
      <p class="mt-6 hidden max-w-md text-base font-light text-white/80 md:block lg:mt-4 lg:text-lg">
        Toma pedidos, coordina la cocina y cobra más rápido, desde el salón o donde estés.
      </p>
      <ul class="mt-6 hidden max-w-lg flex-wrap justify-center gap-2 sm:flex lg:mt-10 lg:justify-start lg:gap-3">
        @for (feature of features; track feature.label) {
        <li
          class="auth-chip inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-medium lg:px-4 lg:py-2 lg:text-sm">
          <app-icon class="h-4 w-4 lg:h-5 lg:w-5">{{ feature.icon }}</app-icon
          >{{ feature.label }}
        </li>
        }
      </ul>
    </section>

    <!-- Formulario en vidrio -->
    <section class="flex items-start justify-center px-4 pb-10 pt-6 sm:items-center sm:px-6 lg:px-12 lg:py-10">
      <div
        class="auth-card w-full max-w-md rounded-[1.75rem] px-5 py-1 sm:rounded-[2rem] sm:px-10 sm:py-2 2xl:max-w-lg">
        <router-outlet></router-outlet>
      </div>
    </section>
  </div>
</div>
