<app-card>
  <ng-template app-slot="header">
    <div class="flex items-center justify-between">
      <app-skeleton [size]="SkeletonSize.SM" class="w-48" />
      <app-skeleton [size]="SkeletonSize.SM" class="w-12" />
    </div>
  </ng-template>

  <div class="grid grid-cols-2 gap-6 p-4">
    @for (item of [1,2,3,4,5,6,7,8]; track item) {
    <div class="flex flex-col gap-3">
      <app-skeleton [size]="SkeletonSize.XS" class="w-24" />
      <app-skeleton [size]="SkeletonSize.XS" class="w-32" />
    </div>
    }
  </div>

  <ng-template app-slot="footer">
    <div class="grid grid-cols-2 gap-4 xl:grid-cols-12">
      <app-skeleton [size]="SkeletonSize.SM" class="col-span-1 xl:col-span-2 xl:col-end-11" />
      <app-skeleton [size]="SkeletonSize.SM" class="col-span-1 xl:col-span-2 xl:col-end-13" />
    </div>
  </ng-template>
</app-card>
