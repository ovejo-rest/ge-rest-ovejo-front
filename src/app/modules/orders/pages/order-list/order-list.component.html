@let orders = $orders(); @let isLoading = $isLoading(); @let hasError = $hasError();

<div>
  <app-header-dashboard title="Pedidos" subtitle="Gestiona los pedidos de tu restaurante">
    <app-button full impact="light" tone="primary" shape="rounded" size="medium" icon="refresh" (buttonClick)="retry()">
      Actualizar
    </app-button>
  </app-header-dashboard>

  @if (hasError) {
  <div class="flex flex-col items-center gap-4 py-16 text-center">
    <app-icon class="text-destructive h-14 w-14">error_outline</app-icon>
    <div>
      <h2 class="text-foreground text-lg font-semibold">Error al cargar los pedidos</h2>
      <p class="text-muted-foreground mt-1 text-sm">No se pudieron obtener los datos. Intenta nuevamente.</p>
    </div>
    <app-button impact="bold" tone="primary" shape="rounded" (buttonClick)="retry()">Reintentar</app-button>
  </div>
  } @else {
  <app-orders-table
    [orders]="orders?.data ?? []"
    [pagination]="orders?.pagination ?? { page: 1, perPage: 10, totalItems: 0, totalPages: 0 }"
    [isLoading]="isLoading ?? false"
    (pageChange)="onPageChange($event)"
    (perPageChange)="onPerPageChange($event)"
    (searchTableChange)="onSearchTable($event)"
    (statusFilterChange)="onStatusFilter($event)"
    (retryData)="retry()" />
  }
</div>
