<app-modal-card>
  <ng-template app-slot="header">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Nueva reserva</h2>
  </ng-template>

  <div class="space-y-4">
    <app-customer-selector [selected]="$customer()" (selectedChange)="$customer.set($event)" />
    <app-booking-form-fields [form]="form" [tables]="$tables()" />
  </div>

  <ng-template app-slot="footer">
    <div class="flex justify-end gap-3">
      <app-button type="button" impact="light" [disabled]="$isSaving()" (buttonClick)="handleCancel()">Cancelar</app-button>
      <app-button type="button" impact="bold" [disabled]="$isSaving()" [isLoading]="$isSaving()" (buttonClick)="handleSubmit()">Reservar</app-button>
    </div>
  </ng-template>
</app-modal-card>
