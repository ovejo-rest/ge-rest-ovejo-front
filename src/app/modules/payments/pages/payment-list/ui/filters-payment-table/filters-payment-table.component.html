<form [formGroup]="form" class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow mb-4">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        Método de Pago
      </label>
      <select
        formControlName="method"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-100"
      >
        <option value="">Todos</option>
        @for (method of paymentMethods; track method) {
          <option [value]="method">{{ getMethodLabel(method) }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        Fecha Inicio
      </label>
      <input
        type="date"
        formControlName="startDate"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-100"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        Fecha Fin
      </label>
      <input
        type="date"
        formControlName="endDate"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-100"
      />
    </div>

    <div class="flex items-end gap-2">
      <app-button
        type="button"
        impact="bold"
        (buttonClick)="onApply()"
      >
        Aplicar
      </app-button>
      <app-button
        type="button"
        impact="light"
        (buttonClick)="onClear()"
      >
        Limpiar
      </app-button>
    </div>
  </div>
</form>
