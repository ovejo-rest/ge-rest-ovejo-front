<app-modal-card>
  <ng-template app-slot="header">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Nueva estación</h2>
  </ng-template>

  <app-station-form-fields [form]="form" [printers]="data.printers" />

  <ng-template app-slot="footer">
    <div class="flex justify-end gap-3">
      <app-button type="button" impact="light" [disabled]="!!$isLoading()" (buttonClick)="handleCancel()">Cancelar</app-button>
      <app-button type="button" impact="bold" [disabled]="!!$isLoading()" [isLoading]="!!$isLoading()" (buttonClick)="handleSubmit()">Crear estación</app-button>
    </div>
  </ng-template>
</app-modal-card>
