<app-card>
  <ng-template app-slot="header" class="text-primary dark:text-foreground">Contacto</ng-template>

  <form [formGroup]="form" class="grid grid-cols-4 gap-4 p-2">
    <div class="col-span-4 block md:col-span-2">
      <div class="text-start w-full pt-1"><h3 class="text-foreground">Región</h3></div>
      <div class="col-span-2">
        <input type="text" id="regionName" formControlName="regionName" class="peer block w-full" />
      </div>
    </div>
    <div class="col-span-4 block md:col-span-2">
      <div class="text-start w-full pt-1"><h3 class="text-foreground">Provincia</h3></div>
      <div class="col-span-2">
        <input type="text" id="provinceName" formControlName="provinceName" class="peer block w-full" />
      </div>
    </div>
    <div class="col-span-4 block md:col-span-2">
      <div class="w-full pt-1"><h3 class="text-foreground">Comuna</h3></div>
      <div class="col-span-2">
        <input type="text" id="communeName" formControlName="communeName" class="peer block w-full" />
      </div>
    </div>

    <div class="col-span-4 block md:col-span-2">
      <div class="w-full pt-1"><h3 class="text-foreground">Ciudad</h3></div>
      <div class="col-span-2">
        <input type="text" id="city" formControlName="city" class="peer block w-full" />
      </div>
    </div>
    <div class="col-span-4 block">
      <div class="w-full pt-1"><h3 class="text-foreground">Dirección</h3></div>
      <div class="col-span-2">
        <input maxlength="12" type="text" id="address" formControlName="address" class="peer block w-full" />
      </div>
    </div>

    <div class="col-span-2 block">
      <div class="w-full pt-1"><h3 class="text-foreground">Teléfono</h3></div>
      <div class="col-span-2">
        <input [maxLength]="12" type="email" id="phone" formControlName="phone" class="peer block w-full" />
      </div>
    </div>
    <div class="col-span-2 block">
      <div class="w-full pt-1"><h3 class="text-foreground">Celular</h3></div>
      <div class="col-span-2">
        <input [maxLength]="12" type="email" id="cellphone" formControlName="cellphone" class="peer block w-full" />
      </div>
    </div>
  </form>

  <ng-template app-slot="footer">
    <app-button (buttonClick)="updateContact()">Actualizar contacto</app-button>
  </ng-template>
</app-card>
