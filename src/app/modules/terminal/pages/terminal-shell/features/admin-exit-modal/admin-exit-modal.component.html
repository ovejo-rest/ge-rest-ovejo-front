<app-modal-card>
  <ng-template app-slot="header">
    <h2 class="flex items-center gap-2 text-xl font-semibold text-gray-900 dark:text-gray-100">
      <app-icon class="h-6 w-6">admin_panel_settings</app-icon>Administrar terminal
    </h2>
  </ng-template>

  <p class="text-muted-foreground mb-4 text-sm">Ingresa tus credenciales para salir del modo terminal y volver al backoffice en este equipo.</p>
  <form [formGroup]="form" class="space-y-3" (ngSubmit)="handleSubmit()">
    <input type="email" formControlName="email" autocomplete="username" placeholder="Email" aria-label="Email" class="glass-input w-full rounded-md px-3 py-2.5" />
    <input type="password" formControlName="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" class="glass-input w-full rounded-md px-3 py-2.5" />
    <button type="submit" class="hidden" aria-hidden="true"></button>
  </form>

  <ng-template app-slot="footer">
    <div class="flex justify-end gap-3">
      <app-button type="button" impact="light" [disabled]="$isChecking()" (buttonClick)="handleCancel()">Volver</app-button>
      <app-button type="button" impact="bold" [disabled]="$isChecking()" [isLoading]="$isChecking()" (buttonClick)="handleSubmit()">Salir del modo terminal</app-button>
    </div>
  </ng-template>
</app-modal-card>
