<app-modal-card>
  <ng-template app-slot="header">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Anular pago</h2>
  </ng-template>

  <div class="space-y-4 py-2">
    <div class="flex items-start gap-3">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-red-500/15 text-red-600">
        <app-icon class="h-5 w-5">block</app-icon>
      </div>
      <div>
        <p class="text-foreground text-sm">
          ¿Anular el pago de <span class="font-semibold">{{ formatCurrency(payment.amount) }}</span> en {{ methodLabel(payment.method).toLowerCase() }}?
        </p>
        <p class="text-muted-foreground mt-1 text-sm">Quedará registrado como anulado y el saldo volverá al pedido.</p>
      </div>
    </div>

    <div>
      <label for="void-reason" class="text-foreground mb-1 block text-sm font-medium">Motivo *</label>
      <div class="mb-2 flex flex-wrap gap-2">
        @for (option of reasons; track option) {
        <button type="button" class="glass-row rounded-full px-3 py-1 text-xs" (click)="reason.setValue(option)">{{ option }}</button>
        }
      </div>
      <textarea
        id="void-reason"
        [formControl]="reason"
        rows="2"
        maxlength="255"
        placeholder="Escribe o elige un motivo"
        class="glass-input w-full rounded-md px-3 py-2"
        [class.border-red-500]="reason.invalid && reason.touched"></textarea>
    </div>
  </div>

  <ng-template app-slot="footer">
    <div class="flex justify-end gap-3">
      <app-button type="button" impact="light" [disabled]="!!$isLoading()" (buttonClick)="handleCancel()"> Volver </app-button>
      <app-button type="button" impact="bold" tone="danger" [disabled]="!!$isLoading()" [isLoading]="!!$isLoading()" (buttonClick)="handleConfirm()">
        Anular pago
      </app-button>
    </div>
  </ng-template>
</app-modal-card>
