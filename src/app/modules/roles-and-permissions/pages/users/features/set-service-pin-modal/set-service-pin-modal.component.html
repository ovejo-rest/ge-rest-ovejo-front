<app-modal-card>
  <ng-template app-slot="header">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">PIN para el POS</h2>
  </ng-template>

  <p class="text-muted-foreground mb-4 text-sm">
    {{ user.name }} {{ user.fatherLastName }} usará este PIN para identificarse en el POS. Si ya tenía uno, se reemplaza.
  </p>

  <form [formGroup]="form" class="space-y-3" (ngSubmit)="handleSubmit()">
    <div>
      <label for="pin" class="text-foreground mb-1 block text-sm font-medium">PIN (4 dígitos)</label>
      <div class="relative">
        <input
          id="pin"
          [type]="$showPin() ? 'text' : 'password'"
          inputmode="numeric"
          autocomplete="new-password"
          maxlength="4"
          formControlName="pin"
          class="glass-input w-full rounded-md px-3 py-2 pr-10 text-lg tracking-[0.4em]"
          [class.border-red-500]="form.controls.pin.invalid && form.controls.pin.touched"
          (input)="onlyDigits('pin', $event)" />
        <button
          type="button"
          class="text-muted-foreground absolute inset-y-0 right-2 flex items-center"
          [attr.aria-label]="$showPin() ? 'Ocultar PIN' : 'Mostrar PIN'"
          (click)="$showPin.set(!$showPin())">
          <app-icon class="h-5 w-5">{{ $showPin() ? 'visibility_off' : 'visibility' }}</app-icon>
        </button>
      </div>
    </div>
    <div>
      <label for="pin-confirm" class="text-foreground mb-1 block text-sm font-medium">Repite el PIN</label>
      <input
        id="pin-confirm"
        [type]="$showPin() ? 'text' : 'password'"
        inputmode="numeric"
        autocomplete="new-password"
        maxlength="4"
        formControlName="confirm"
        class="glass-input w-full rounded-md px-3 py-2 text-lg tracking-[0.4em]"
        [class.border-red-500]="form.hasError('mismatch') && form.controls.confirm.touched"
        (input)="onlyDigits('confirm', $event)" />
    </div>
  </form>

  <ng-template app-slot="footer">
    <div class="flex justify-end gap-3">
      <app-button type="button" impact="light" [disabled]="!!$isLoading()" (buttonClick)="handleCancel()">Cancelar</app-button>
      <app-button type="button" impact="bold" [disabled]="!!$isLoading()" [isLoading]="!!$isLoading()" (buttonClick)="handleSubmit()">
        Guardar PIN
      </app-button>
    </div>
  </ng-template>
</app-modal-card>
