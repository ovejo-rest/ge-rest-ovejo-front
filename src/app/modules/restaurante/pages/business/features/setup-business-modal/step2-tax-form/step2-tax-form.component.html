<form [formGroup]="form" (ngSubmit)="submitForm()">
  <div class="grid grid-cols-3 gap-4 p-2">
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground" disabled>Etiqueta</h3>
    </div>
    <div class="col-span-2">
      <input type="text" id="taxLabel1" formControlName="taxLabel1" />
    </div>
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">RUT del negocio</h3>
    </div>
    <div class="col-span-2">
      <input type="text" id="taxNumber1" formControlName="taxNumber1" appRut maxlength="12" />
    </div>
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Impuesto por defecto (%)</h3>
    </div>
    <div class="col-span-2">
      <input type="number" id="defaultSalesTax" formControlName="defaultSalesTax" />
    </div>
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Precio de venta</h3>
    </div>
    <div class="col-span-2">
      <select id="sellPriceTax" formControlName="sellPriceTax">
        @for (option of sellPriceTaxOptions; track option.value) {
        <option [ngValue]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Etiqueta código 1</h3>
    </div>
    <div class="col-span-2">
      <input type="text" id="codeLabel1" formControlName="codeLabel1" />
    </div>
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Etiqueta código 2</h3>
    </div>
    <div class="col-span-2">
      <input type="text" id="codeLabel2" formControlName="codeLabel2" />
    </div>
  </div>

  <div class="mt-4 flex justify-end">
    <app-button full impact="bold" [disabled]="form.invalid" (buttonClick)="submitForm()" [isLoading]="$isLoading()">
      Siguiente
    </app-button>
  </div>
</form>
