<app-modal-card>
  <ng-template app-slot="header">
    <h1 class="text-primary dark:text-foreground">{{ data.title }}</h1>
  </ng-template>
  <button mat-icon-button class="close-button" (click)="dialogRef.close()">
    <app-icon class="text-primary">close</app-icon>
  </button>

  <div class="p-2 text-center text-foreground">
    {{ data.message }}
  </div>

  <ng-template app-slot="footer">
    <div class="grid grid-cols-2 gap-2">
      <app-button full impact="light" (buttonClick)="dialogRef.close()">{{ data.cancelText ?? 'Cancelar' }}</app-button>
      <app-button full impact="bold" [tone]="data.tone ?? 'primary'" (buttonClick)="confirm()">{{ data.confirmText ?? 'Confirmar' }}</app-button>
    </div>
  </ng-template>
</app-modal-card>
