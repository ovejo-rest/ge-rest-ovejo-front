@if (isLoading()) {
<app-progress-bar />
} @else if ($tables().length === 0) {
<div class="flex flex-col items-center gap-2 py-12 text-center">
  <app-icon class="text-muted-foreground h-12 w-12">table_bar</app-icon>
  <p class="text-muted-foreground text-sm">No hay mesas registradas</p>
</div>
} @else {
<div class="space-y-6">
  @for (group of $groups(); track group.sectorId) {
  <div>
    <div class="mb-3 flex items-center gap-2">
      <h3 class="text-foreground text-lg font-semibold">{{ group.name }}</h3>
      <span class="text-muted-foreground text-sm">{{ group.tables.length }} mesas</span>
    </div>
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
      @for (table of group.tables; track table.id) {
      <button
        type="button"
        class="flex cursor-pointer flex-col items-center gap-2 rounded-xl border-2 p-4 transition-all hover:scale-105 active:scale-95"
        [class]="statusClasses(table.status)"
        [attr.aria-label]="table.name + ', ' + statusLabel(table.status) + ', ' + table.capacity + ' personas'"
        (click)="tableSelect.emit(table)">
        <app-icon class="h-8 w-8">{{ statusIcon(table.status) }}</app-icon>
        <span class="text-sm font-semibold">{{ table.name }}</span>
        <span class="text-xs">{{ table.capacity }} pers. · {{ statusLabel(table.status) }}</span>
      </button>
      }
    </div>
  </div>
  }
</div>
}
