<div class="flex flex-wrap gap-2 border-muted/20 border-b pb-2">
  <button
    class="rounded-lg px-4 py-2 text-sm font-medium transition-all"
    [ngClass]="
      $activeTab() === null
        ? 'bg-primary text-primary-foreground shadow-sm'
        : 'bg-muted/30 text-muted-foreground hover:bg-muted/50'
    "
    (click)="selectTab(null)">
    Todos
  </button>

  @for (sector of $sectors(); track sector.id) {
  <button
    class="rounded-lg px-4 py-2 text-sm font-medium transition-all"
    [ngClass]="
      $activeTab() === sector.id
        ? 'bg-primary text-primary-foreground shadow-sm'
        : 'bg-muted/30 text-muted-foreground hover:bg-muted/50'
    "
    (click)="selectTab(sector.id)">
    {{ sector.name }}
  </button>
  }
</div>
