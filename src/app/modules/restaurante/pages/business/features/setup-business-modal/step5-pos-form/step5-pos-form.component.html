<form [formGroup]="form" (ngSubmit)="submitForm()">
  <div class="grid grid-cols-3 gap-4 p-2">
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Activar meseros</h3>
    </div>
    <div class="col-span-2 flex items-center pt-1">
      <app-toggle
        [checked]="!!form.get('waiterEnabled')!.value"
        (changed)="form.get('waiterEnabled')!.setValue($event)" />
    </div>
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Activar mesas</h3>
    </div>
    <div class="col-span-2 flex items-center pt-1">
      <app-toggle
        [checked]="!!form.get('tablesEnabled')!.value"
        (changed)="form.get('tablesEnabled')!.setValue($event)" />
    </div>
    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Exigir personal de servicio</h3>
    </div>
    <div class="col-span-2 flex items-center pt-1">
      <app-toggle
        [checked]="!!form.get('isServiceStaffRequired')!.value"
        (changed)="form.get('isServiceStaffRequired')!.setValue($event)" />
    </div>

    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Módulos del POS</h3>
    </div>
    <div class="col-span-2" formGroupName="modules">
      @for (mod of moduleOptions; track mod.value) {
      <label class="flex items-center gap-2 mb-1">
        <input type="checkbox" [formControlName]="mod.value" class="w-4 h-4" />
        <span class="text-foreground">{{ mod.label }}</span>
      </label>
      }
    </div>

    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Activar tooltips</h3>
    </div>
    <div class="col-span-2 flex items-center pt-1">
      <app-toggle [checked]="!!form.get('enableTooltip')!.value" (changed)="onEnableTooltipChange($event)" />
    </div>

    <div class="text-end w-full pt-1">
      <h3 class="text-foreground">Días para editar transacciones</h3>
    </div>
    <div class="col-span-2">
      <input type="number" id="transactionEditDays" formControlName="transactionEditDays" />
    </div>
  </div>

  <div class="mt-4 flex justify-end">
    <app-button full impact="bold" [disabled]="form.invalid" (buttonClick)="submitForm()" [isLoading]="$isLoading()">
      Completar
    </app-button>
  </div>
</form>
