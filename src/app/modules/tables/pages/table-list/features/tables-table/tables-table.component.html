<app-table>
  <ng-template app-slot="filters">
    <app-filters-table (searchNameChange)="onSearchNameChange($event)" (statusChange)="onStatusFilterChange($event)" />
  </ng-template>
  <ng-template app-slot="head">
    <tr>
      @for (item of headerData; track $index) { <th class="h-8 w-[20%] text-center">{{ item }}</th> }
      <th class="w-[90px]"></th>
    </tr>
  </ng-template>
  @if (!isLoading()) {
  @for (table of $tables(); track table.id) {
  <tr class="glass-row h-10">
    <td class="text-center font-medium">{{ table.name }}</td>
    <td class="text-muted-foreground text-center">{{ table.capacity }} pers.</td>
    <td class="text-center">
      <span class="inline-flex items-center gap-1.5">
        <span class="inline-block h-3 w-3 rounded-full" [style.background-color]="table.sectorColor"></span>
        {{ table.sectorName }}
      </span>
    </td>
    <td class="text-center">
      <span class="inline-block rounded-full px-2 py-0.5 text-xs font-medium" [ngClass]="statusClasses(table.status)">
        {{ statusLabel(table.status) }}
      </span>
    </td>
    <td class="w-[90px] text-center">
      <div class="flex items-center justify-center gap-1">
        <app-button size="small" icon="edit_document" (click)="updateTable(table)" />
        <app-button size="small" icon="delete" tone="danger" (click)="deleteTable(table)" />
      </div>
    </td>
  </tr>
  } @empty {
  <tr><td class="py-4 text-center text-sm" colspan="6">No hay mesas</td></tr>
  } } @if (isLoading()) {
  <tr><td colspan="6" class="px-2 py-4"><app-progress-bar /></td></tr>
  }
  <ng-template app-slot="footer">
    <div class="glass-footer -mx-5 -mb-3 flex flex-wrap items-center justify-between gap-2 px-5 py-3">
      <div class="flex items-center gap-2">Mostrar<select class="glass-input w-16 rounded-md p-2" [value]="perPage()" (change)="onPerPageChange($event)"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="50">50</option></select>por página</div>
      <app-pagination-table [pagination]="$pagination()" (pageChange)="onChangePage($event)" />
    </div>
  </ng-template>
</app-table>
